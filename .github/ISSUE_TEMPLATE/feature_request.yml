name: Feature request
description: Suggest an idea or improvement for Camcord.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, and where the current workflow falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Camcord to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other apps or workarounds you have tried, and what they do well or badly.
