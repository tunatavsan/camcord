name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode and log tool versions
        shell: bash
        run: |
          for version in 26.6 26.5; do
            if [[ -d "/Applications/Xcode_${version}.app" ]]; then
              sudo xcode-select -s "/Applications/Xcode_${version}.app"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          swift build -Xswiftc -warnings-as-errors 2>&1 | tee build.log
          ! grep -q 'warning:' build.log

      - name: Test
        timeout-minutes: 15
        run: swift test -Xswiftc -warnings-as-errors --no-parallel

      - name: Package an unsigned app bundle
        run: scripts/build.sh --unsigned
